<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" href="/static/predictor-icon.png">
<link rel="apple-touch-icon" href="/static/predictor-icon.png">
<title>{% block title %}Premier League Predictor{% endblock %}</title>
<style>
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --accent:#2563eb;
  --danger:#dc2626;
  --soft:#f8fafc
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#e8eef7 0,#f8fafc 280px);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.container{
  width:min(1040px,100%);
  margin:auto;
  padding:18px 14px 40px
}
.hero{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  padding:26px;
  border-radius:24px;
  margin-bottom:16px;
  box-shadow:0 18px 45px rgba(15,23,42,.18)
}
.hero h1{
  margin:4px 0 6px;
  font-size:clamp(26px,5vw,40px)
}
.hero p{
  margin:0;
  color:#cbd5e1
}
.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 16px
}
.nav a{
  text-decoration:none;
  color:#334155;
  background:#fff;
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:12px;
  font-weight:700
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 10px 30px rgba(15,23,42,.07)
}
.card h2,.card h3{
  margin-top:0
}
.flash{
  padding:12px 14px;
  border-radius:14px;
  margin-bottom:14px;
  font-weight:700
}
.flash.success{
  background:#dcfce7;
  color:#166534
}
.flash.error{
  background:#fee2e2;
  color:#991b1b
}
button{
  border:0;
  border-radius:12px;
  background:var(--ink);
  color:white;
  padding:12px 17px;
  font-size:15px;
  font-weight:800;
  cursor:pointer
}
.primary{background:var(--accent)}
.danger{background:var(--danger)}
input{
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:12px 13px;
  font-size:17px
}
.muted,.small{
  color:var(--muted)
}
.small{
  font-size:13px
}
.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 9px;
  border-radius:999px;
  background:#e2e8f0;
  color:#475569;
  font-size:12px;
  font-weight:800
}
.badge.open{
  background:#dcfce7;
  color:#166534
}
.badge.live{
  background:#fee2e2;
  color:#b91c1c
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px
}
.stat{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px
}
.stat-number{
  font-size:34px;
  font-weight:900
}
.fixture{
  padding:15px 0;
  border-bottom:1px solid var(--line)
}
.fixture:last-child{
  border-bottom:0
}
.gameweek-buttons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:10px
}
.gameweek-buttons a{
  text-decoration:none
}
.gameweek-buttons button{
  width:100%;
  background:#f8fafc;
  color:#0f172a;
  border:1px solid var(--line)
}
.pred-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  margin-bottom:16px
}
.kickoff{
  color:var(--muted);
  font-size:13px;
  margin-top:4px
}
.scoreline{
  display:grid;
  grid-template-columns:minmax(0,1fr) 60px 22px 60px minmax(0,1fr);
  gap:8px;
  align-items:center
}
.team{
  font-weight:800
}
.team.away{
  text-align:right
}
.score-input{
  width:60px;
  height:54px;
  padding:0;
  text-align:center;
  font-size:24px;
  font-weight:900
}
.dash{
  text-align:center;
  color:#94a3b8
}
.locked-score{
  width:60px;
  height:54px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:#f1f5f9;
  font-size:24px;
  font-weight:900
}
.save-bar{
  position:sticky;
  bottom:10px;
  padding:10px;
  background:#fffffff2;
  border:1px solid var(--line);
  border-radius:18px
}
.save-bar button{
  width:100%;
  background:var(--accent)
}
.leader-row{
  display:grid;
  grid-template-columns:46px 1fr auto;
  gap:12px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid var(--line)
}
.rank{
  font-size:24px;
  font-weight:900;
  text-align:center
}
.leader-points{
  font-size:25px;
  font-weight:900
}
.points-pill{
  background:#dbeafe;
  color:#1d4ed8;
  padding:6px 10px;
  border-radius:999px;
  font-weight:900
}
.live-score{
  font-size:24px;
  font-weight:900
}
.pick-grid{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  align-items:center;
  padding:8px 0
}
table{
  width:100%;
  border-collapse:collapse
}
th,td{
  padding:12px 8px;
  border-bottom:1px solid var(--line);
  text-align:left
}
.footer{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  padding:14px 0 0
}
@media(max-width:620px){
  .container{padding:10px}
  .hero{padding:21px}
  .card{padding:16px}
  .nav{
    overflow-x:auto;
    flex-wrap:nowrap
  }
  .nav a{
    white-space:nowrap
  }
  .scoreline{
    grid-template-columns:minmax(0,1fr) 52px 16px 52px minmax(0,1fr);
    gap:6px
  }
  .score-input,.locked-score{
    width:52px;
    height:50px
  }
  .team{
    font-size:14px
  }
}


.tv-logo {
    display: block;
    height: 17px;
    width: auto;
    max-width: 76px;
    object-fit: contain;
}

.tv-logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 76px;
    min-height: 20px;
    margin-left: 6px;
    vertical-align: middle;
}


/* v1.18.0 mobile readability */
@media (max-width: 640px) {
    body {
        font-size: 15px;
    }

    .container {
        width: auto;
        padding-left: 10px;
        padding-right: 10px;
    }

    .nav {
        gap: 6px;
    }

    .nav a {
        padding: 8px 10px;
        font-size: 13px;
    }

    .card {
        padding: 12px;
        border-radius: 14px;
    }

    .fixture {
        padding: 11px 8px;
        gap: 6px;
    }

    .fixture-teams {
        min-width: 0;
        gap: 6px;
    }

    .fixture-team {
        min-width: 0;
        line-height: 1.15;
        font-size: 14px;
    }

    .fixture-team.home {
        text-align: right;
    }

    .fixture-team.away {
        text-align: left;
    }

    .fixture-score,
    .fixture-vs {
        flex: 0 0 auto;
        min-width: 32px;
        text-align: center;
    }

    .fixture-meta {
        font-size: 11px;
        line-height: 1.25;
        text-align: center;
    }

    .tv-logo {
        height: 14px;
        max-width: 62px;
    }

    .tv-logo-wrap {
        min-width: 62px;
        min-height: 17px;
        margin: 3px auto 0;
        display: flex;
        justify-content: center;
    }

    input[type="number"] {
        width: 48px;
        min-width: 48px;
        padding: 8px 4px;
        text-align: center;
    }

    button,
    .button {
        min-height: 40px;
    }

    table {
        font-size: 13px;
    }

    th, td {
        padding: 7px 5px;
    }
}


/* v1.18.1 structured fixture layout */
.fixture-row-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
        "match status"
        "scorers scorers"
        "meta broadcaster";
    column-gap: 14px;
    row-gap: 7px;
    align-items: center;
}

.fixture-match {
    grid-area: match;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.fixture-home {
    text-align: right;
    min-width: 0;
    line-height: 1.2;
}

.fixture-away {
    text-align: left;
    min-width: 0;
    line-height: 1.2;
}

.fixture-centre {
    text-align: center;
    font-weight: 800;
    white-space: nowrap;
}

.fixture-status {
    grid-area: status;
    justify-self: end;
}

.fixture-submeta {
    grid-area: meta;
    text-align: center;
    font-size: 12px;
    color: var(--muted, #64748b);
}

.fixture-scorers {
    grid-area: scorers;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 34px;
    margin-top: -2px;
    padding: 0 120px;
    color: #64748b;
    font-size: 12px;
    line-height: 1.4;
}

.fixture-scorers-home,
.fixture-scorers-away {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.fixture-scorers-home {
    text-align: right;
}

.fixture-scorers-away {
    text-align: left;
}

.fixture-broadcaster {
    grid-area: broadcaster;
    justify-self: center;
    min-width: 82px;
    min-height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.fixture-broadcaster .tv-logo {
    margin: 0;
}

@media (max-width: 640px) {
    .fixture-row-grid {
        grid-template-columns: 1fr 70px;
        grid-template-areas:
            "match match"
            "scorers scorers"
            "meta broadcaster"
            "status status";
        row-gap: 8px;
        column-gap: 8px;
    }

    .fixture-match {
        grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr);
        gap: 5px;
        width: 100%;
    }

    .fixture-home,
    .fixture-away {
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .fixture-centre {
        font-size: 13px;
    }

    .fixture-submeta {
        justify-self: start;
        text-align: left;
        font-size: 11px;
        line-height: 1.25;
    }

    .fixture-scorers {
        gap: 20px;
        margin: 0;
        padding: 0 8px;
    }

    .fixture-status {
        justify-self: stretch;
        text-align: center;
    }

    .fixture-status .badge {
        display: inline-block;
        min-width: 92px;
        text-align: center;
    }

    .fixture-broadcaster {
        justify-self: end;
        min-width: 70px;
        min-height: 18px;
    }

    .fixture-broadcaster .tv-logo {
        height: 13px;
        max-width: 58px;
    }
}


/* v1.19.0 centred responsive navigation and position movement */
.nav {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(135px, 1fr)
    );
    gap: 8px;
    align-items: stretch;
}

.nav a {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    text-align: center;
    line-height: 1.15;
    white-space: normal;
}

.leader-row {
    grid-template-columns: 44px 34px minmax(0, 1fr) auto;
}

.position-move {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
}

.position-up {
    color: #16a34a;
}

.position-down {
    color: #dc2626;
}

.position-flat {
    color: #94a3b8;
}

@media (max-width: 640px) {
    .nav {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
        gap: 7px;
        width: 100%;
    }

    .nav a {
        min-height: 44px;
        padding: 8px 6px;
        font-size: 12px;
        border-radius: 10px;
    }

    .nav a img {
        flex: 0 0 auto;
    }

    .leader-row {
        grid-template-columns:
            36px 26px minmax(0, 1fr) auto;
        gap: 7px;
    }

    .position-move {
        min-width: 22px;
        font-size: 11px;
    }
}

@media (max-width: 360px) {
    .nav {
        grid-template-columns: 1fr;
    }
}


/* v1.20.0 local fixture match statistics */
.match-stats {
    margin-top: 10px;
    border-top: 1px solid #e2e8f0;
}

.match-stats summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 2px 2px;
    font-size: 13px;
    font-weight: 900;
    user-select: none;
}

.match-stats summary::-webkit-details-marker {
    display: none;
}

.match-stats-chevron {
    transition: transform .15s ease;
}

.match-stats[open] .match-stats-chevron {
    transform: rotate(180deg);
}

.match-stats-body {
    padding-top: 11px;
}

.match-stats-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.match-stat-panel {
    padding: 11px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    text-align: center;
}

.match-record {
    margin: 5px 0 3px;
    font-size: 17px;
}

.match-stats-section {
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px solid #e2e8f0;
}

.form-row {
    display: grid;
    grid-template-columns: minmax(90px, 1fr) auto;
    gap: 10px;
    align-items: center;
    margin-top: 8px;
}

.form-team {
    min-width: 0;
    font-size: 13px;
    font-weight: 800;
}

.form-badges {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.form-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 900;
    color: white;
}

.form-w {
    background: #16a34a;
}

.form-d {
    background: #64748b;
}

.form-l {
    background: #dc2626;
}

.h2h-summary {
    margin-top: 8px;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
}

.past-results {
    margin-top: 9px;
}

.past-result {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr);
    gap: 8px;
    padding: 7px 0;
    border-top: 1px solid #eef2f7;
    font-size: 12px;
}

.past-result-date {
    color: #64748b;
}

.past-result-score {
    text-align: right;
}

.match-stats-footnote {
    margin-top: 12px;
    font-size: 10px;
    color: #94a3b8;
    text-align: center;
}

@media (max-width: 640px) {
    .match-stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 7px;
    }

    .match-stat-panel {
        padding: 9px 6px;
    }

    .match-record {
        font-size: 15px;
    }

    .match-stat-panel .muted {
        font-size: 10px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 5px;
    }

    .form-badges {
        justify-content: flex-start;
    }

    .past-result {
        grid-template-columns: 70px minmax(0, 1fr);
        font-size: 11px;
    }
}




/* v1.20.3 standalone fixture cards */
.fixture-set {
    margin-bottom: 14px;
}

.fixture-set:last-child {
    margin-bottom: 0;
}

/* Dashboard fixture cards */
.fixture.fixture-set {
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.55);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
}

/* Predictions / Live GW cards already use .card; strengthen just enough
   to make each fixture feel self-contained. */
.card.fixture-set {
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    overflow: hidden;
}

/* Keep Match Stats visually subordinate to the outer fixture card. */
.fixture-set .match-stats {
    margin-top: 12px;
    border-top: 1px solid #e2e8f0;
}

.fixture-set .match-stat-panel {
    background: rgba(248, 250, 252, 0.55);
    border-color: #e2e8f0;
}

@media (max-width: 640px) {
    .fixture-set {
        margin-bottom: 12px;
    }

    .fixture.fixture-set {
        padding: 12px;
        border-radius: 12px;
    }

    .card.fixture-set {
        border-radius: 12px;
    }
}


/* v1.0.1 desktop-only Live Gameweek score alignment */
@media (min-width: 641px) {
    .live-fixture-match {
        grid-template-columns:
            minmax(0, 1fr)
            84px
            minmax(0, 1fr);
        gap: 12px;
    }

    .live-score-grid {
        display: grid;
        grid-template-columns: 26px 20px 26px;
        align-items: center;
        justify-content: center;
        width: 84px;
        min-width: 84px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .live-score-home,
    .live-score-away,
    .live-score-dash {
        display: block;
        width: 100%;
        text-align: center;
        line-height: 1;
    }

    .live-score-dash {
        font-weight: 700;
    }

    .live-fixture-match .fixture-home {
        padding-right: 2px;
    }

    .live-fixture-match .fixture-away {
        padding-left: 2px;
    }
}

</style>
</head>
<body>

<div class="container">

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}
<div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}

{% block content %}{% endblock %}

<div class="footer">
Premier League Predictor v{{ app_version }}
</div>

</div>

</body>
</html>
